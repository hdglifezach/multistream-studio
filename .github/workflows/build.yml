# Builds the OBS plugin DLL, the app exe and the setup exe on a GitHub-hosted Windows runner,
# from pinned downloads only (see tools/prepare_sdk.ps1), and uploads them as workflow artifacts.
#
# Code signing (SignPath Foundation) is wired in but DISABLED until the project is approved:
# set the repository variable SIGNPATH_ENABLED=true, SIGNPATH_ORGANIZATION_ID=<org id> and the secret
# SIGNPATH_API_TOKEN, and adjust the project/policy/artifact-configuration slugs below.
# Two stages, because the setup exe embeds the app exe and the DLL:
#   stage 1 signs MultistreamStudio.exe + multistream-studio.dll, stage 2 rebuilds the setup with those and signs it.
# SignPath OSS rule: every job that leads to a signing request must run on a GitHub-hosted runner (it does).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  SIGNPATH_PROJECT_SLUG: multistream-studio        # placeholder: the SignPath project slug
  SIGNPATH_POLICY_SLUG: release-signing            # placeholder: "test-signing" while trying it out
  SIGNPATH_ARTIFACT_CONFIG_BINARIES: binaries      # placeholder: artifact configuration for the exe + dll zip
  SIGNPATH_ARTIFACT_CONFIG_SETUP: setup            # placeholder: artifact configuration for the setup exe zip

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check the version is consistent everywhere
        shell: pwsh
        run: |
          python tools/check_version.py
          "APP_VERSION=$((Get-Content VERSION -Raw).Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache OBS SDK downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/obs-sdk/downloads
          key: obs-sdk-downloads-${{ hashFiles('tools/prepare_sdk.ps1') }}

      - name: Prepare OBS SDK (OBS 32.2.2 sources + Windows build, obs-deps Qt 6, pinned and hash-checked)
        shell: pwsh
        run: pwsh -File tools/prepare_sdk.ps1 -Root "$env:RUNNER_TEMP\obs-sdk"

      - name: Build the OBS plugin
        shell: cmd
        env:
          OBS_SDK_ROOT: ${{ runner.temp }}\obs-sdk
        run: call plugin\build.bat

      - name: Build the app exe and the setup exe (unsigned)
        shell: cmd
        env:
          PYTHON: python
        run: call installer\build_setup.bat

      - name: Verify product metadata on every binary (SignPath requires ProductName + ProductVersion)
        shell: pwsh
        run: |
          $files = @("plugin\build\multistream-studio.dll", "installer\pkg\dist\MultistreamStudio\MultistreamStudio.exe", "installer\out\MultistreamStudio-Setup.exe")
          foreach ($f in $files) {
            $vi = (Get-Item $f).VersionInfo
            "$f : $($vi.ProductName) $($vi.ProductVersion)"
            if ($vi.ProductName -ne "Multistream Studio") { throw "$f has no ProductName" }
            if (-not $vi.ProductVersion.StartsWith($env:APP_VERSION)) { throw "$f ProductVersion $($vi.ProductVersion) != $env:APP_VERSION" }
          }

      - name: Collect the unsigned binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\unsigned | Out-Null
          Copy-Item plugin\build\multistream-studio.dll artifacts\unsigned\
          Copy-Item installer\pkg\dist\MultistreamStudio\MultistreamStudio.exe artifacts\unsigned\

      - name: Upload unsigned binaries (exe + dll)
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries-${{ env.APP_VERSION }}
          path: artifacts/unsigned
          if-no-files-found: error

      # ---------------------------------------------------------------- SignPath stage 1 (disabled until approved)
      - name: Sign the app exe and the plugin DLL (SignPath Foundation)
        id: sign-binaries
        if: ${{ vars.SIGNPATH_ENABLED == 'true' && github.event_name != 'pull_request' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIG_BINARIES }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: artifacts/signed

      - name: Rebuild the setup exe with the signed binaries
        if: ${{ steps.sign-binaries.outcome == 'success' }}
        shell: cmd
        env:
          PYTHON: python
          SIGNED_DIR: ${{ github.workspace }}\artifacts\signed
        run: call installer\build_setup.bat

      - name: Collect the setup exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\setup | Out-Null
          Copy-Item installer\out\MultistreamStudio-Setup.exe artifacts\setup\

      - name: Upload setup exe
        id: upload-setup
        uses: actions/upload-artifact@v4
        with:
          name: setup-${{ steps.sign-binaries.outcome == 'success' && 'signed-binaries' || 'unsigned' }}-${{ env.APP_VERSION }}
          path: artifacts/setup
          if-no-files-found: error

      # ---------------------------------------------------------------- SignPath stage 2 (disabled until approved)
      - name: Sign the setup exe (SignPath Foundation)
        id: sign-setup
        if: ${{ steps.sign-binaries.outcome == 'success' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIG_SETUP }}
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: artifacts/setup-signed

      - name: Upload the release set
        uses: actions/upload-artifact@v4
        with:
          name: MultistreamStudio-${{ env.APP_VERSION }}-windows-x64${{ steps.sign-setup.outcome == 'success' && '-signed' || '' }}
          path: |
            ${{ steps.sign-setup.outcome == 'success' && 'artifacts/setup-signed/MultistreamStudio-Setup.exe' || 'artifacts/setup/MultistreamStudio-Setup.exe' }}
            ${{ steps.sign-binaries.outcome == 'success' && 'artifacts/signed/multistream-studio.dll' || 'artifacts/unsigned/multistream-studio.dll' }}
            LICENSE
            README.md
            CODE_SIGNING_POLICY.md
          if-no-files-found: error
